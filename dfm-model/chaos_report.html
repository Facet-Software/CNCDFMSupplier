  <script>window.__REPORT__ = {"filename": "chaos.step", "analyzed_at": "2026-03-14T03:47:13.856833+00:00", "bounding_box": {"x": 112.0, "y": 84.0, "z": 35.0}, "bbox_volume_mm3": 329283.3, "solid_volume_mm3": 267987.1, "machined_volume_mm3": 61296.1, "material_removal_pct": 18.6, "planar_faces": 30, "machine_classification": "3-AXIS-STANDARD", "fixturing_count": 2, "fixturings": [{"id": 0, "label": "+Z", "setup_type": "3-axis-standard", "planar": 26, "floor": 5, "wall": 20, "holes": 0, "fillets": 0, "tool_changes": 1, "min_tool_dia": 5.6, "concerns": {"critical": 0, "warning": 16, "advisory": 3}}, {"id": 1, "label": "+Y", "setup_type": "3-axis-standard", "planar": 1, "floor": 0, "wall": 1, "holes": 0, "fillets": 0, "tool_changes": 1, "min_tool_dia": null, "concerns": {"critical": 0, "warning": 0, "advisory": 0}}], "holes": [{"id": 1, "type": "through_countersink", "radius_mm": 2.8, "depth_mm": 35.0, "cone_angle": 45.0, "ld": 6.2, "face_idxs": [20, 9]}, {"id": 2, "type": "through", "radius_mm": 3.5, "depth_mm": 35.0, "cone_angle": null, "ld": 5.0, "face_idxs": [10]}, {"id": 3, "type": "through_counterbore", "radius_mm": 2.8, "depth_mm": 35.0, "cone_angle": null, "ld": 6.2, "face_idxs": [29, 11]}, {"id": 4, "type": "blind_flat", "radius_mm": 3.5, "depth_mm": 35.0, "cone_angle": null, "ld": 5.0, "face_idxs": [16]}, {"id": 5, "type": "blind_flat", "radius_mm": 3.5, "depth_mm": 35.0, "cone_angle": null, "ld": 5.0, "face_idxs": [17]}, {"id": 6, "type": "blind_flat", "radius_mm": 3.5, "depth_mm": 35.0, "cone_angle": null, "ld": 5.0, "face_idxs": [18]}, {"id": 7, "type": "through", "radius_mm": 2.8, "depth_mm": 35.0, "cone_angle": null, "ld": 6.2, "face_idxs": [19]}, {"id": 8, "type": "blind_flat", "radius_mm": 0.525, "depth_mm": 35.0, "cone_angle": null, "ld": 33.3, "face_idxs": [34]}, {"id": 9, "type": "through", "radius_mm": 2.8, "depth_mm": 84.0, "cone_angle": null, "ld": 15.0, "face_idxs": [35]}], "dfm": [{"severity": "critical", "code": "hole_ld", "fixturing": "—", "m 30 and 32 — tool always leaves a radius, requires fillet or EDM"}, {"severity": "warning", "code": "sharp_internal_corner", "fixturing": "+Z", "message": "Fixturing +Z: sharp internal corner between faces 31 and 33 — tool always leaves a radius, requires fillet or EDM"}, {"severity": "warning", "code": "sharp_internal_corner", "fixturing": "+Z", "message": "Fixturing +Z: sharp internal corner between faces 32 and 33 — tool always leaves a radius, requires fillet or EDM"}, {"severity": "warning", "code": "partial_hole", "fixturing": "—", "message": "Hole 2 (⌀7.00 mm): bore wall intersected by another feature — 14% of circumference exposed (minor clipping). Confirm geometry is intentional."}, {"severity": "advisory", "code": "hole_ld", "fixturing": "—", "message": "Hole 8: L/D = 5.3:1 (depth 5.6 mm / dia 1.05 mm) — standard tooling reaches limit — verify spindle reach"}, {"severity": "advisory", "code": "small_hole", "fixturing": "—", "message": "Hole 8: dia = 1.050 mm — specialty tooling required, slower cycle time"}, {"severity": "advisory", "code": "deep_feature", "fixturing": "+Z", "message": "Fixturing +Z, face 3: depth = 16.8 mm, min tool dia = 5.60 mm, L/D = 3.0"}, {"severity": "advisory", "code": "deep_feature", "fixturing": "+Z", "message": "Fixturing +Z, face 4: depth = 16.8 mm, min tool dia = 5.60 mm, L/D = 3.0"}, {"severity": "advisory", "code": "deep_feature", "fixturing": "+Z", "message": "Fixturing +Z, face 7: depth = 24.5 mm, min tool dia = 5.60 mm, L/D = 4.4"}]};</script>
  <script type="text/babel">
const R = window.__REPORT__;

const HOLE_LABELS = {
  through:             "Through",
  through_counterbore: "Counterbore",
  through_countersink: "Countersink",
  blind_flat:          "Blind (flat)",
  blind_with_tip:      "Blind (drill tip)",
};

const SEV_COLOR  = { critical: "#c0392b", warning: "#d97706", advisory: "#6b7280" };
const SEV_BG     = { critical: "#fef2f2", warning: "#fffbeb", advisory: "#f9fafb" };
const SEV_BORDER = { critical: "#fca5a5", warning: "#fcd34d", advisory: "#e5e7eb" };
const SEV_LABEL  = { critical: "CRITICAL", warning: "WARNING", advisory: "ADVISORY" };

function SectionHead({ children }) {
  return (
    <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.14em", textTransform: "uppercase", color: "#6b7280", marginBottom: 8 }}>{children}</div>
  );
}

function App() {
  const crits = R.dfm.filter(d => d.severity === "critical").length;
  const warns = R.dfm.filter(d => d.severity === "warning").length;
  const advs  = R.dfm.filter(d => d.severity === "advisory").length;
  const totalFlags = crits + warns + advs;
  const flagColor = crits > 0 ? SEV_COLOR.critical : warns > 0 ? SEV_COLOR.warning : "#16a34a";

  // Group flags by code, preserving severity-sorted order
  const SEV_RANK = { critical: 0, warning: 1, advisory: 2 };
  const CODE_LABELS = {
    hole_ld:                 "Deep Hole (L/D)",
    small_hole:              "Small Hole",
    ball_nose_required:      "Ball Nose Required",
    concave_fillet_tool_dia: "Concave Fillet Tool",
    sharp_internal_corner:   "Sharp Internal Corner",
    deep_feature:            "Deep Feature",
    thin_wall:               "Thin Wall",
    thin_wall_hole_proximity:"Thin Wall — Hole Proximity",
    partial_hole:            "Partial / Intersected Hole",
  };

  const groups = [];
  const seen   = {};
  for (const d of R.dfm) {
    if (!seen[d.code]) {
      seen[d.code] = { code: d.code, severity: d.severity, items: [] };
      groups.push(seen[d.code]);
    }
    // Escalate group severity to worst member
    if (SEV_RANK[d.severity] < SEV_RANK[seen[d.code].severity]) {
      seen[d.code].severity = d.severity;
    }
    seen[d.code].items.push(d);
  }

  const [expanded, setExpanded] = React.useState({});
  const toggle = (code) => setExpanded(e => ({ ...e, [code]: !e[code] }));

  return (
    <div style={{ background: "#f8f7f4", minHeight: "100vh", fontFamily: "'IBM Plex Sans', system-ui, sans-serif", color: "#1a1a1a" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @media print { body { background: white; } }
      `}</style>

      <div style={{ maxWidth: 860, margin: "0 auto", padding: "40px 40px 60px" }}>

        {/* HEADER */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 32, paddingBottom: 24, borderBottom: "2px solid #1a1a1a" }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.18em", color: "#6b7280", marginBottom: 6, textTransform: "uppercase" }}>
              Facet — Part Analysis Report
            </div>
            <div style={{ fontSize: 24, fontWeight: 600, color: "#1a1a1a", letterSpacing: "-0.01em", marginBottom: 4 }}>
              {R.filename}
            </div>
            <div style={{ fontSize: 12, color: "#9ca3af" }}>
              {new Date(R.analyzed_at).toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" })}
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.14em", color: "#9ca3af", marginBottom: 5, textTransform: "uppercase" }}>Machine Type</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, fontWeight: 500, color: "#1a1a1a" }}>
              {R.machine_classification.replace(/-/g, " ")}
            </div>
          </div>
        </div>

        {/* STAT STRIP */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 1, marginBottom: 36, background: "#e5e3df", borderRadius: 6, overflow: "hidden" }}>
          {[
            { label: "Setups Required",  value: R.fixturing_count,   sub: "fixturings" },
            { label: "Bounding Box",     value: `${R.bounding_box.x} × ${R.bounding_box.y} × ${R.bounding_box.z}`, sub: "mm  X · Y · Z" },
            { label: "Planar Faces",     value: R.planar_faces,      sub: "flat surfaces" },
            { label: "Material Removed", value: `${R.material_removal_pct}%`, sub: `${(R.machined_volume_mm3/1000).toFixed(1)} cm³ of ${(R.bbox_volume_mm3/1000).toFixed(1)} cm³ bbox`, accent: R.material_removal_pct > 70 ? SEV_COLOR.warning : "#1a1a1a" },
            { label: "Holes",            value: R.holes.length,      sub: `${R.holes.filter(h=>h.type.startsWith("blind")).length} blind · ${R.holes.filter(h=>h.type.startsWith("through")).length} through` },
            { label: "DFM Flags",        value: totalFlags,          sub: totalFlags === 0 ? "no issues" : `${crits} crit · ${warns} warn · ${advs} adv`, accent: flagColor },
          ].map(({ label, value, sub, accent }) => (
            <div key={label} style={{ background: "#fff", padding: "16px 18px" }}>
              <div style={{ fontSize: 9, fontWeight: 600, letterSpacing: "0.14em", color: "#9ca3af", textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
              <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 15, fontWeight: 500, color: accent || "#1a1a1a", lineHeight: 1.2, marginBottom: 4 }}>{value}</div>
              <div style={{ fontSize: 10, color: "#9ca3af" }}>{sub}</div>
            </div>
          ))}
        </div>

        {/* TWO COLUMN */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginBottom: 28 }}>

          {/* SETUPS */}
          <div>
            <SectionHead>Setup Summary</SectionHead>
            <div style={{ background: "#fff", border: "1px solid #e5e3df", borderRadius: 6, overflow: "hidden" }}>
              <div style={{ display: "grid", gridTemplateColumns: "44px 1fr 52px 52px 52px", padding: "7px 14px", background: "#f8f7f4", borderBottom: "1px solid #e5e3df" }}>
                {["Axis", "Features", "Holes", "Faces", "Flags"].map((h, i) => (
                  <div key={h} style={{ fontSize: 9, fontWeight: 600, letterSpacing: "0.12em", color: "#9ca3af", textTransform: "uppercase", textAlign: i > 1 ? "right" : "left" }}>{h}</div>
                ))}
              </div>
              {R.fixturings.map((f, i) => {
                const tc = f.concerns.critical + f.concerns.warning + f.concerns.advisory;
                const fc = f.concerns.critical > 0 ? SEV_COLOR.critical : f.concerns.warning > 0 ? SEV_COLOR.warning : f.concerns.advisory > 0 ? SEV_COLOR.advisory : "#9ca3af";
                return (
                  <div key={f.id} style={{ display: "grid", gridTemplateColumns: "44px 1fr 52px 52px 52px", padding: "11px 14px", borderBottom: i < R.fixturings.length - 1 ? "1px solid #f0ede9" : "none", alignItems: "center" }}>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 14, fontWeight: 500, color: "#1a1a1a" }}>{f.label}</div>
                    <div style={{ fontSize: 11, color: "#6b7280" }}>
                      {[
                        f.planar > 0 && `${f.planar} planar`,
                        f.fillets > 0 && `${f.fillets} fillet${f.fillets > 1 ? "s" : ""}`,
                        f.min_tool_dia && `min ⌀${f.min_tool_dia}mm`,
                        `~${f.tool_changes} tool chg`,
                      ].filter(Boolean).join(" · ")}
                    </div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#1a1a1a", textAlign: "right" }}>{f.holes}</div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, color: "#1a1a1a", textAlign: "right" }}>{f.planar}</div>
                    <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 13, fontWeight: tc > 0 ? 600 : 400, color: fc, textAlign: "right" }}>{tc || "—"}</div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* HOLES */}
          <div>
            <SectionHead>Hole Inventory</SectionHead>
            <div style={{ background: "#fff", border: "1px solid #e5e3df", borderRadius: 6, overflow: "hidden" }}>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 64px 68px 48px", padding: "7px 14px", background: "#f8f7f4", borderBottom: "1px solid #e5e3df" }}>
                {["Type", "⌀ (mm)", "Depth", "L/D"].map((h, i) => (
                  <div key={h} style={{ fontSize: 9, fontWeight: 600, letterSpacing: "0.12em", color: "#9ca3af", textTransform: "uppercase", textAlign: i > 0 ? "right" : "left" }}>{h}</div>
                ))}
              </div>
              {R.holes.length === 0
                ? <div style={{ padding: "14px", fontSize: 12, color: "#9ca3af" }}>No holes detected</div>
                : R.holes.map((h, i) => {
                  const ldColor = !h.ld ? "#9ca3af" : h.ld >= 6 ? SEV_COLOR.critical : h.ld >= 4 ? SEV_COLOR.warning : "#374151";
                  const isBlind = h.type.startsWith("blind");
                  return (
                    <div key={h.id} style={{ display: "grid", gridTemplateColumns: "1fr 64px 68px 48px", padding: "10px 14px", borderBottom: i < R.holes.length - 1 ? "1px solid #f0ede9" : "none", alignItems: "center" }}>
                      <div>
                        <span style={{ fontSize: 11, fontWeight: 500, color: isBlind ? "#92400e" : "#14532d", background: isBlind ? "#fef3c7" : "#f0fdf4", padding: "2px 7px", borderRadius: 3 }}>
                          {HOLE_LABELS[h.type] || h.type}
                        </span>
                        {h.cone_angle && <span style={{ fontSize: 10, color: "#9ca3af", marginLeft: 6 }}>{h.cone_angle}°</span>}
                      </div>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#374151", textAlign: "right" }}>{(h.radius_mm * 2).toFixed(2)}</div>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: "#374151", textAlign: "right" }}>{h.depth_mm.toFixed(1)} mm</div>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 12, color: ldColor, textAlign: "right", fontWeight: h.ld >= 4 ? 600 : 400 }}>{h.ld ? `${h.ld}:1` : "—"}</div>
                    </div>
                  );
                })}
            </div>
          </div>
        </div>

        {/* DFM FLAGS */}
        {totalFlags > 0 && (
          <div>
            <SectionHead>Manufacturing Flags</SectionHead>
            <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
              {groups.map(g => {
                const sev   = g.severity;
                const open  = !!expanded[g.code];
                const label = CODE_LABELS[g.code] || g.code.replace(/_/g, " ");
                const multi = g.items.length > 1;
                return (
                  <div key={g.code} style={{ borderRadius: 5, overflow: "hidden", border: `1px solid ${SEV_BORDER[sev]}`, borderLeft: `3px solid ${SEV_COLOR[sev]}` }}>
                    {/* GROUP HEADER — always visible, clickable if >1 item */}
                    <div
                      onClick={() => multi && toggle(g.code)}
                      style={{
                        display: "grid", gridTemplateColumns: "88px 1fr auto auto",
                        gap: 12, alignItems: "center",
                        background: SEV_BG[sev],
                        padding: "10px 14px",
                        cursor: multi ? "pointer" : "default",
                        userSelect: "none",
                      }}
                    >
                      <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.12em", color: SEV_COLOR[sev], textTransform: "uppercase" }}>{SEV_LABEL[sev]}</div>
                      <div style={{ fontSize: 12, color: "#374151", lineHeight: 1.5 }}>
                        <span style={{ fontWeight: 500 }}>{label}</span>
                        {!multi && (
                          <span style={{ color: "#6b7280", marginLeft: 8, fontFamily: "'IBM Plex Mono', monospace", fontSize: 10 }}>
                            Fix. {g.items[0].fixturing}
                          </span>
                        )}
                        {!open && multi && (
                          <span style={{ color: "#9ca3af", marginLeft: 8, fontSize: 11 }}>
                            — {g.items[0].message.length > 72 ? g.items[0].message.slice(0, 72) + "…" : g.items[0].message}
                          </span>
                        )}
                      </div>
                      {multi && (
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: SEV_COLOR[sev], background: SEV_BORDER[sev], padding: "2px 7px", borderRadius: 3, whiteSpace: "nowrap" }}>
                          {g.items.length}
                        </span>
                      )}
                      {multi && (
                        <span style={{ fontSize: 11, color: "#9ca3af", width: 14, textAlign: "center" }}>{open ? "▲" : "▼"}</span>
                      )}
                    </div>
                    {/* EXPANDED ITEMS */}
                    {(open || !multi) && multi && (
                      <div style={{ background: "#fff", borderTop: `1px solid ${SEV_BORDER[sev]}` }}>
                        {g.items.map((d, i) => (
                          <div key={i} style={{
                            display: "grid", gridTemplateColumns: "80px 1fr",
                            gap: 12, alignItems: "start",
                            padding: "9px 14px",
                            borderBottom: i < g.items.length - 1 ? `1px solid ${SEV_BORDER[sev]}` : "none",
                            background: i % 2 === 0 ? "#fff" : "#fafafa",
                          }}>
                            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#9ca3af", paddingTop: 1 }}>Fix. {d.fixturing}</div>
                            <div style={{ fontSize: 11, color: "#374151", lineHeight: 1.55 }}>{d.message}</div>
                          </div>
                        ))}
                      </div>
                    )}
                    {/* SINGLE ITEM — show message inline below header */}
                    {!multi && (
                      <div style={{ background: "#fff", borderTop: `1px solid ${SEV_BORDER[sev]}`, padding: "9px 14px" }}>
                        <div style={{ fontSize: 11, color: "#374151", lineHeight: 1.6 }}>{g.items[0].message}</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {totalFlags === 0 && (
          <div style={{ background: "#f0fdf4", border: "1px solid #bbf7d0", borderRadius: 6, padding: "14px 18px", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#16a34a", flexShrink: 0 }} />
            <div style={{ fontSize: 13, color: "#15803d", fontWeight: 500 }}>No manufacturing flags — part appears suitable for standard CNC machining.</div>
          </div>
        )}

        {/* FOOTER */}
        <div style={{ marginTop: 40, paddingTop: 16, borderTop: "1px solid #e5e3df", display: "flex", justifyContent: "flex-end" }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: "#d1cdc7" }}>{R.filename}</div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
